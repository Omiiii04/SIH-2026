[pytest]
# ── Discovery ─────────────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── asyncio mode ──────────────────────────────────────────────────────────────
asyncio_mode = auto

# ── Output ────────────────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers

# ── Custom markers ────────────────────────────────────────────────────────────
markers =
    integration: marks tests that require live external services (deselect with -m "not integration")
    slow: marks slow-running tests
